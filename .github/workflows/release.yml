name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts only; do not publish a release
        type: boolean
        default: false
      force_publish:
        description: Re-publish to Modrinth and CurseForge even if the GitHub release already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          GRADLE_VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "Could not read version from gradle.properties" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            TAG_VERSION="${TAG#v}"
            if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
              echo "Tag $TAG (${TAG_VERSION}) does not match gradle.properties (${GRADLE_VERSION})" >&2
              exit 1
            fi
          else
            TAG="v${GRADLE_VERSION}"
          fi
          echo "version=${GRADLE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Skip if release already fully published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.force_publish }}" = "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "force_publish or dry_run requested; not skipping."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSET_COUNT="$(gh release view "$TAG" --json assets -q '.assets | length')"
          # One jar per Stonecutter node. Publish GitHub Release runs after every Modrinth and
          # CurseForge publish succeeded, so four assets mean the release is fully published.
          if [ "$ASSET_COUNT" -ge 4 ]; then
            echo "Release $TAG already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check publish secrets
        if: steps.published.outputs.skip != 'true' && (github.event_name == 'push' || inputs.dry_run != true)
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          EMPTY=""
          if [ -z "$MODRINTH_TOKEN" ]; then
            EMPTY="MODRINTH_TOKEN"
          fi
          if [ -z "$CURSEFORGE_API_KEY" ]; then
            EMPTY="${EMPTY:+$EMPTY and }CURSEFORGE_API_KEY"
          fi
          if [ -n "$EMPTY" ]; then
            echo "Publish secret is empty: $EMPTY" >&2
            exit 1
          fi

      - name: Check the tag is this commit
        if: steps.published.outputs.skip != 'true' && (github.event_name == 'push' || inputs.dry_run != true)
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # The last line names the commit an annotated tag points at. It is empty when the tag does not exist.
          TAG_SHA="$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -n 1 | cut -f1)"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "Tag $TAG is at $TAG_SHA but this run builds $HEAD_SHA. Run from the tag, or move the tag." >&2
            exit 1
          fi

      - name: Set up JDK 25
        if: steps.published.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        if: steps.published.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build every version and loader
        if: steps.published.outputs.skip != 'true'
        run: ./gradlew chiseledBuild --continue --stacktrace

      - name: Stage release artifacts
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          STAGING="release-artifacts"
          mkdir -p "$STAGING"
          find versions -path '*/build/libs/*.jar' -exec cp {} "$STAGING/" \;
          ls -lh "$STAGING"
          JARS="$(find "$STAGING" -name '*.jar' | wc -l)"
          if [ "$JARS" -ne 4 ]; then
            echo "Expected 4 jars, found $JARS" >&2
            exit 1
          fi

      - name: Extract changelog notes
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f
          ' CHANGELOG.md > release-notes.md || true
          {
            echo "RELEASE_CHANGELOG<<__EOF__"
            cat release-notes.md
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Upload artifact bundle
        if: steps.published.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish to Modrinth & CurseForge
        if: steps.published.outputs.skip != 'true' && (github.event_name == 'push' || inputs.dry_run != true)
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: ./gradlew chiseledPublish --continue --stacktrace

      - name: Publish GitHub Release
        if: steps.published.outputs.skip != 'true' && (github.event_name == 'push' || inputs.dry_run != true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          STAGING="release-artifacts"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$STAGING"/* --clobber
          elif [ -s release-notes.md ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file release-notes.md "$STAGING"/*
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes "$STAGING"/*
          fi
