org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=false

# Static semantic version (the release tag must match this).
version=0.3.0

# Mod identity
mod_id=cleansingpotions
mod_name=CleansingPotions
mod_group=so.alaz
mod_author=Alazso
mod_license=MIT
mod_description=Milk-brewed potions that cleanse status effects: drink, splash, or lingering. Cleansing clears all, Soothing clears the bad, Purging strips the good.

curseforge_id=1583938
modrinth_id=gZfP9OGb

# Per-version dependency coordinates (key suffix = the Minecraft version).
# Minecraft 26.x is unobfuscated and runs on Java 25, so there is no mappings or parchment entry.
# Each patch compiles against its own Minecraft: 26.x carries breaking ABI changes between drops
# and has no intermediary cushion to absorb them.
# pack.mcmeta format per version (the data pack numbering, which is what the mod's recipes ride on).
# Pack format carries a minor now: 26.2 is 107.1, 26.3 is 121.0.
pack_format_26.2=107
pack_format_minor_26.2=1
pack_format_26.3=121
pack_format_minor_26.3=0

# FastStats: modded builds are published per exact Minecraft version as <sdk>+mc<version>, and the
# nested mod pins that version exactly, so each node needs the artifact matching its own Minecraft.
# (SDK 0.31.0 replaced the earlier +mc<from>-<to> ranges.) The bare <sdk> version has no Minecraft
# compatibility layer and throws at startup.

# --- 26.2 ---
fabric_api_26.2=0.160.0+26.2
fabric_loader_26.2=0.19.5
modmenu_26.2=20.0.2
cloth_26.2=26.2.155
neoforge_26.2=26.2.0.88
faststats_fabric_26.2=0.31.0+mc26.2
faststats_neoforge_26.2=0.31.0+mc26.2
# --- 26.3 (Fabric only for now; NeoForge is still 26.3.0.1-beta) ---
fabric_api_26.3=0.160.5+26.3
fabric_loader_26.3=0.19.5
modmenu_26.3=21.0.0-beta.1
cloth_26.3=26.3.158
faststats_fabric_26.3=0.31.0+mc26.3
